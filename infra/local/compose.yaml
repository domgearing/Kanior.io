name: verelo-local

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_USER: ${VERELO_POSTGRES_USER:-verelo_admin}
      POSTGRES_PASSWORD: ${VERELO_POSTGRES_PASSWORD:-verelo_admin}
      POSTGRES_DB: ${VERELO_POSTGRES_DB:-verelo}
      VERELO_MIGRATOR_DB_PASSWORD: ${VERELO_MIGRATOR_DB_PASSWORD:-verelo_migrator}
      VERELO_API_DB_PASSWORD: ${VERELO_API_DB_PASSWORD:-verelo_api}
      VERELO_WORKER_DB_PASSWORD: ${VERELO_WORKER_DB_PASSWORD:-verelo_worker}
    ports:
      - "127.0.0.1:${VERELO_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

volumes:
  postgres-data:

version = 1

[suites.pr]
evals = ["harness_self_test"]

[suites.full]
evals = ["harness_self_test"]

[evals.harness_self_test]
description = "Proves the eval harness can execute a check, parse a metric, and enforce a threshold."
command = ["python", "evals/checks/harness_self_test.py"]
metric = "pass_rate"
comparison = "gte"
threshold = 1.0
blocking = true

